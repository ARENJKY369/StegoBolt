# ---------------------------------------------------------------------------
# StegoBolt Engine v2.0 â€” zero-disk, zero-knowledge runtime configuration
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.shutdown=graceful

# ---- Zero-disk multipart policy -------------------------------------------
# The servlet container would normally spill uploads to java.io.tmpdir once a
# part exceeds the threshold. We set the threshold to ~2 GiB (the maximum the
# spec allows) so EVERY upload stays in volatile RAM, and cap requests at
# 80 MiB so the heap stays bounded. Nothing is ever written to /tmp.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2147483647
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=80MB

# Do not let Jackson (or any framework) write pretty logs of bodies.
spring.jackson.default-property-inclusion=non_null

# ---- Logging: zero payload logging ----------------------------------------
# Engines only log operation names, mediums and byte counts. Root stays at INFO;
# never raise framework request-logging to DEBUG/TRACE in production â€” that can
# dump multipart structure and headers.
logging.level.root=INFO
logging.level.com.stegobolt.engine=INFO


